<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Checkbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2>Selecione a área de interesse</h2>
        <form action="processa_form2.php" method="post">
            <div class="d-grid gap-3">
                <div class="border border-3 rounded p-3">
                    <input type="checkbox" name="interesses[]" value="tec"> Tecnologia<br>
                    <input type="checkbox" name="interesses[]" value="esporte"> Esportes<br>
                    <input type="checkbox" name="interesses[]" value="musica"> Música<br>
                    <input type="checkbox" name="interesses[]" value="travel"> Viagens<br>
                    <button type="submit">Enviar</button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
